<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tron-like Demo</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #02030a;
        color: #6fe6ff;
        font-family:
          'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #overlay {
        position: fixed;
        left: 16px;
        top: 12px;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #6fe6ff;
        text-shadow: 0 0 8px #00b4ff;
        pointer-events: none;
        opacity: 0.85;
      }
      #status {
        position: fixed;
        right: 16px;
        bottom: 12px;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #ff4ad8;
        text-shadow: 0 0 6px #ff4ad8;
        pointer-events: none;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="overlay">// TRON :: GRID FLIGHT</div>
    <div id="status">∞ LOOP</div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.160.0"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';

      const canvas = document.getElementById('scene');
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.setClearColor(0x02030a, 1);

      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x02030a, 60, 320);

      const camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 6, 18);
      camera.lookAt(0, 4, 0);

      // ---------------------------------------------------------------
      // Terrain: a triangulated heightmap that tiles seamlessly along Z.
      // We build two identical chunks and recycle them so the world
      // appears infinite.
      // ---------------------------------------------------------------
      const TILE_W = 240; // width along X
      const TILE_D = 240; // depth along Z
      const SEG_W = 80; // x segments
      const SEG_D = 80; // z segments

      // Seamless heightmap: combines several sine waves so the value at
      // z = -TILE_D/2 equals the value at z = +TILE_D/2 for any x. This
      // makes the two tiles align perfectly when one wraps behind the
      // other, producing a true infinite loop.
      const TWO_PI = Math.PI * 2;
      const heightAt = (x, z) => {
        const u = (z + TILE_D / 2) / TILE_D; // 0..1 along the tile
        const a = Math.sin(u * TWO_PI) * 4.5;
        const b = Math.sin(u * TWO_PI * 2 + x * 0.05) * 2.2;
        const c = Math.cos(x * 0.12) * 3.0;
        const d = Math.sin(x * 0.05 + u * TWO_PI * 3) * 1.6;
        // Mountains rise away from the centerline (the "track")
        const ridge = Math.min(1, Math.abs(x) / 40);
        const peaks = ridge * ridge * 14;
        return a + b + c + d + peaks;
      };

      const buildTerrainMesh = () => {
        const geometry = new THREE.PlaneGeometry(TILE_W, TILE_D, SEG_W, SEG_D);
        geometry.rotateX(-Math.PI / 2);
        const pos = geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const z = pos.getZ(i);
          pos.setY(i, heightAt(x, z));
        }
        pos.needsUpdate = true;
        geometry.computeVertexNormals();

        const wireMat = new THREE.LineBasicMaterial({
          color: 0x00f0ff,
          transparent: true,
          opacity: 0.85,
        });
        const wireframe = new THREE.LineSegments(
          new THREE.WireframeGeometry(geometry),
          wireMat
        );

        const fillMat = new THREE.MeshBasicMaterial({
          color: 0x020a18,
          transparent: true,
          opacity: 0.9,
          polygonOffset: true,
          polygonOffsetFactor: 1,
          polygonOffsetUnits: 1,
        });
        const fill = new THREE.Mesh(geometry, fillMat);

        const group = new THREE.Group();
        group.add(fill);
        group.add(wireframe);
        return group;
      };

      const tileA = buildTerrainMesh();
      const tileB = buildTerrainMesh();
      tileA.position.z = 0;
      tileB.position.z = -TILE_D;
      scene.add(tileA);
      scene.add(tileB);

      // ---------------------------------------------------------------
      // Spaceship: a triangulated wedge built from raw triangles, with
      // a magenta wireframe overlay for the Tron look.
      // ---------------------------------------------------------------
      const buildShip = () => {
        const verts = new Float32Array([
          // nose
          0, 0, -3,
          // body quad-ish (left, right, back-left, back-right)
          -1.6, -0.2, 0.5, 1.6, -0.2, 0.5, -2.4, 0.0, 1.8, 2.4, 0.0, 1.8,
          // tail center
          0, 0.3, 1.2,
          // top spine
          0, 0.9, -0.6,
        ]);
        const idx = [
          // top: nose -> spine -> sides
          0, 6, 1, 0, 2, 6,
          // belly: nose -> sides -> back
          0, 1, 3, 0, 4, 2,
          // wings
          1, 3, 5, 2, 5, 4,
          // back
          3, 4, 5,
          // spine to back
          6, 5, 3, 6, 4, 5,
          // close underside between wings
          1, 5, 3, 2, 4, 5,
        ];
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
        geo.setIndex(idx);
        geo.computeVertexNormals();

        const body = new THREE.Mesh(
          geo,
          new THREE.MeshBasicMaterial({
            color: 0x05101a,
            transparent: true,
            opacity: 0.95,
            polygonOffset: true,
            polygonOffsetFactor: 1,
            polygonOffsetUnits: 1,
          })
        );
        const wires = new THREE.LineSegments(
          new THREE.WireframeGeometry(geo),
          new THREE.LineBasicMaterial({ color: 0xff3df0 })
        );
        const glow = new THREE.PointLight(0xff3df0, 1.2, 12);
        glow.position.set(0, 0.2, 1.2);

        const group = new THREE.Group();
        group.add(body);
        group.add(wires);
        group.add(glow);
        group.scale.setScalar(1.0);
        return group;
      };

      const ship = buildShip();
      ship.position.set(0, 6.5, 6);
      scene.add(ship);

      // ---------------------------------------------------------------
      // Star field
      // ---------------------------------------------------------------
      const buildStars = () => {
        const N = 600;
        const positions = new Float32Array(N * 3);
        for (let i = 0; i < N; i++) {
          positions[i * 3 + 0] = (Math.random() - 0.5) * 800;
          positions[i * 3 + 1] = Math.random() * 200 + 30;
          positions[i * 3 + 2] = -Math.random() * 800;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const mat = new THREE.PointsMaterial({
          color: 0x9be8ff,
          size: 1.2,
          sizeAttenuation: true,
          transparent: true,
          opacity: 0.85,
        });
        return new THREE.Points(geo, mat);
      };
      scene.add(buildStars());

      // ---------------------------------------------------------------
      // Distant horizon glow (a thin neon line where ground meets sky)
      // ---------------------------------------------------------------
      const horizonGeo = new THREE.PlaneGeometry(800, 0.6);
      horizonGeo.translate(0, 0, -300);
      const horizon = new THREE.Mesh(
        horizonGeo,
        new THREE.MeshBasicMaterial({
          color: 0xff3df0,
          transparent: true,
          opacity: 0.6,
        })
      );
      horizon.position.y = 0.2;
      scene.add(horizon);

      // ---------------------------------------------------------------
      // Animation: terrain scrolls forward continuously; when a tile
      // moves past the camera we recycle it behind the far one. The
      // heightmap is z-periodic over TILE_D so the seam is invisible.
      // ---------------------------------------------------------------
      const SPEED = 28; // world units per second
      const clock = new THREE.Clock();

      const tick = () => {
        const dt = Math.min(clock.getDelta(), 0.05);
        const t = clock.elapsedTime;

        tileA.position.z += SPEED * dt;
        tileB.position.z += SPEED * dt;

        // Recycle tiles to create the infinite loop.
        if (tileA.position.z >= TILE_D) {
          tileA.position.z = tileB.position.z - TILE_D;
        }
        if (tileB.position.z >= TILE_D) {
          tileB.position.z = tileA.position.z - TILE_D;
        }

        // Subtle ship motion: hover, sway, slight roll
        ship.position.x = Math.sin(t * 0.6) * 2.4;
        ship.position.y = 6.5 + Math.sin(t * 1.3) * 0.35;
        ship.rotation.z = -Math.sin(t * 0.6) * 0.25;
        ship.rotation.x = Math.sin(t * 1.3) * 0.06;

        // Camera breathes a little to reinforce the flight feel
        camera.position.y = 6 + Math.sin(t * 0.7) * 0.4;
        camera.lookAt(ship.position.x * 0.3, 5.5, -10);

        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      };

      const onResize = () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      };
      window.addEventListener('resize', onResize);

      tick();

      // Expose for tests / debugging
      window.__tronDemo = { THREE, scene, camera, renderer, ship };
    </script>
  </body>
</html>
